services:
  searxng:
    container_name: karna_searxng
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../config/searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8080/
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
